<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16425B"/>
      <stop offset="50%" stop-color="#2F6690"/>
      <stop offset="100%" stop-color="#3A7CA5"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="20" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Book cover background -->
  <rect width="400" height="560" rx="6" fill="url(#bg)"/>
  <!-- Spine highlight -->
  <rect x="0" y="0" width="14" height="560" fill="url(#spine)" rx="6"/>
  <!-- Book icon -->
  <g transform="translate(200, 230)" opacity="0.18">
    <rect x="-70" y="-80" width="140" height="180" rx="8" stroke="white" stroke-width="3" fill="none"/>
    <line x1="-50" y1="-55" x2="50" y2="-55" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-50" y1="-35" x2="50" y2="-35" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-50" y1="-15" x2="50" y2="-15" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-50" y1="5" x2="20" y2="5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Decorative dots -->
  <circle cx="320" cy="80" r="40" fill="white" opacity="0.06"/>
  <circle cx="80" cy="480" r="60" fill="white" opacity="0.04"/>
  <circle cx="340" cy="460" r="30" fill="rgba(129,195,215,0.15)"/>
  <!-- DisciMind branding -->
  <text x="200" y="440" text-anchor="middle" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="0.08em">学研智擎</text>
</svg>
